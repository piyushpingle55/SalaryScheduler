global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'salary_scheduler_app'
    scheme: 'https'  # Set to https because your app uses SSL (https://localhost:7159)
    tls_config:
      insecure_skip_verify: true # Allows self-signed localhost SSL certificates
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:7159'] # Updated port to match Hangfire URL (7159)