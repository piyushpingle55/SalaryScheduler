version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-for-scheduler
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:latest
    container_name: loki-for-scheduler
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-for-scheduler
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki